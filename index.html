<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чекунец Банк</title>
<meta name="theme-color" content="#0b0d16">
<meta name="description" content="Чекунец Банк — банк с валютой чекурубль: карта, переводы, игры, кредиты.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">🏦</div>
  <div class="boot-name">ЧЕКУНЕЦ БАНК</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
<section id="screen-auth" class="screen">
  <div class="auth-wrap">
    <header class="auth-head">
      <div class="auth-logo">🏦</div>
      <h1>Чекунец Банк</h1>
      <p class="muted">Банк, где деньги — <b>чекурубли</b> <span class="cur">₡</span></p>
      <div id="backend-badge" class="badge">…</div>
    </header>

    <div id="auth-tabs" class="seg">
      <button class="seg-btn active" data-auth="login">Вход</button>
      <button class="seg-btn" data-auth="register">Регистрация</button>
    </div>

    <!-- ВХОД -->
    <form id="form-login" class="card form">
      <label class="field">
        <span>Телефон</span>
        <input id="li-phone" type="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" autocomplete="username">
        <em class="err"></em>
      </label>
      <label class="field">
        <span>PIN-код (4 цифры)</span>
        <input id="li-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password">
        <em class="err"></em>
      </label>
      <button class="btn primary" type="submit">Войти в личный кабинет</button>
      <p class="hint">Нет счёта? Откройте его на вкладке «Регистрация» — карта выдаётся сразу.</p>
    </form>

    <!-- РЕГИСТРАЦИЯ -->
    <form id="form-register" class="card form hidden">
      <div class="row">
        <label class="field">
          <span>Имя</span>
          <input id="rg-first" placeholder="Иван" autocomplete="given-name">
          <em class="err"></em>
        </label>
        <label class="field">
          <span>Фамилия</span>
          <input id="rg-last" placeholder="Чекунов" autocomplete="family-name">
          <em class="err"></em>
        </label>
      </div>
      <label class="field">
        <span>Телефон</span>
        <input id="rg-phone" type="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel">
        <em class="err"></em>
      </label>
      <label class="field">
        <span>Почта</span>
        <input id="rg-email" type="email" inputmode="email" placeholder="ivan@mail.ru" autocomplete="email">
        <em class="err"></em>
      </label>
      <div class="row">
        <label class="field">
          <span>PIN-код</span>
          <input id="rg-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password">
          <em class="err"></em>
        </label>
        <label class="field">
          <span>Повторите PIN</span>
          <input id="rg-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password">
          <em class="err"></em>
        </label>
      </div>
      <label class="check">
        <input id="rg-agree" type="checkbox">
        <span>Согласен с условиями обслуживания Чекунец Банка</span>
      </label>
      <button class="btn primary" type="submit">Открыть счёт и выпустить карту</button>
    </form>

    <button id="btn-server" class="link-btn">⚙︎ Настройка сервера</button>
  </div>
</section>

<!-- ЭКРАН ВЫДАЧИ КАРТЫ -->
<section id="screen-issued" class="screen">
  <div class="issued-wrap">
    <div class="issued-title">
      <h2>Карта выпущена 🎉</h2>
      <p class="muted">Добро пожаловать в Чекунец Банк, <b id="is-name">—</b></p>
    </div>
    <div id="is-card" class="bankcard big"></div>
    <ul class="issued-facts">
      <li><span>Номер счёта</span><b id="is-acc">—</b></li>
      <li><span>Держатель</span><b id="is-holder">—</b></li>
      <li><span>Срок действия</span><b id="is-exp">—</b></li>
      <li><span>Приветственный бонус</span><b id="is-bonus">—</b></li>
    </ul>
    <button id="btn-issued-go" class="btn primary">Перейти в личный кабинет</button>
  </div>
</section>

<!-- ЛИЧНЫЙ КАБИНЕТ -->
<section id="screen-app" class="screen">
  <header class="topbar">
    <div class="topbar-user">
      <div id="tb-avatar" class="avatar">ЧБ</div>
      <div>
        <div id="tb-name" class="tb-name">—</div>
        <div id="tb-sub" class="tb-sub muted">—</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="tb-mode" class="chip">—</span>
      <button id="btn-refresh" class="icon-btn" title="Обновить">⟳</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home"><i>🏠</i><span>Главная</span></button>
    <button class="tab" data-tab="history"><i>🧾</i><span>История</span></button>
    <button class="tab" data-tab="games"><i>🎮</i><span>Игры</span></button>
    <button class="tab" data-tab="credits"><i>💳</i><span>Кредиты</span></button>
    <button class="tab" data-tab="settings"><i>⚙️</i><span>Настройки</span></button>
    <button class="tab" data-tab="profile"><i>👤</i><span>Профиль</span></button>
  </nav>
</section>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
